<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc">
<title id="title">Human–Environment–Machine navigation framework with three complementary Human resolutions</title>
<desc id="desc">Human macro behavior, meso psychometric cognitive constructs, and a smaller optional micro neural computational level feed dynamic coupling alongside global local immediate Environment and the Machine closed loop. Dashed links are hypotheses, not established causal paths. Neural data are optional.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#526774" stroke-width="1.4"/></marker></defs>
<rect width="1600" height="1280" fill="white"/>
<text x="800" y="44" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="600" fill="#20343f">
<tspan x="800" dy="0">Human navigation: a candidate H × E × M framework</tspan>
</text>
<rect x="80" y="75" width="1440" height="70" rx="10" stroke="#a4b5be" fill="#f2f5f6"/>
<text x="800.0" y="103.35000000000001" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#20343f">
<tspan x="800.0" dy="0">TASK × MOBILITY × HISTORY</tspan>
<tspan x="800.0" dy="26.599999999999998">Episodes: seconds / minutes · learning: days · exposure / memory: years / decades</tspan>
</text>
<rect x="80" y="170" width="470" height="590" rx="10" stroke="#a4b5be" fill="#edf5f1"/>
<text x="315" y="206" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="600" fill="#20343f">
<tspan x="315" dy="0">HUMAN</tspan>
</text>
<rect x="100" y="230" width="430" height="125" rx="10" stroke="#a4b5be" fill="#ffffff"/>
<text x="315.0" y="261.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#20343f">
<tspan x="315.0" dy="0">MACRO — observable behavior</tspan>
<tspan x="315.0" dy="25.2">Walking, stopping, route choice</tspan>
<tspan x="315.0" dy="25.2">Hesitation, backtracking, gaze / head turns</tspan>
<tspan x="315.0" dy="25.2">Observation ≠ lostness / anxiety</tspan>
</text>
<rect x="100" y="375" width="430" height="165" rx="10" stroke="#a4b5be" fill="#ffffff"/>
<text x="315.0" y="413.40000000000003" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#20343f">
<tspan x="315.0" dy="0">MESO — psychometric / cognitive</tspan>
<tspan x="315.0" dy="25.2">Stable traits / capabilities: SoD, memory</tspan>
<tspan x="315.0" dy="25.2">Dynamic states: uncertainty, anxiety, trust</tspan>
<tspan x="315.0" dy="25.2">Representations: place / route / survey</tspan>
<tspan x="315.0" dy="25.2">Strategies: egocentric, allocentric, cue use</tspan>
</text>
<rect x="120" y="560" width="390" height="100" rx="10" stroke="#a4b5be" fill="#f4f6f5"/>
<text x="315.0" y="593.2" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#20343f">
<tspan x="315.0" dy="0">MICRO — optional specialist level</tspan>
<tspan x="315.0" dy="22.4">Neural / computational mechanisms</tspan>
<tspan x="315.0" dy="22.4">Grid / place / SR / integration: contracts only</tspan>
</text>
<text x="315" y="696" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#20343f">
<tspan x="315" dy="0">Complementary resolutions; no fixed causal chain.</tspan>
<tspan x="315" dy="23.799999999999997">Macro-only and macro + meso studies fit.</tspan>
</text>
<rect x="585" y="170" width="430" height="590" rx="10" stroke="#a4b5be" fill="#f2f4ee"/>
<text x="800" y="206" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="600" fill="#20343f">
<tspan x="800" dy="0">ENVIRONMENT</tspan>
</text>
<rect x="605" y="230" width="390" height="110" rx="10" stroke="#a4b5be" fill="#fff"/>
<text x="800.0" y="266.1" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#20343f">
<tspan x="800.0" dy="0">GLOBAL / MACRO</tspan>
<tspan x="800.0" dy="25.2">Topology, complexity, route length</tspan>
<tspan x="800.0" dy="25.2">Connectivity, familiarity</tspan>
</text>
<rect x="605" y="365" width="390" height="110" rx="10" stroke="#a4b5be" fill="#fff"/>
<text x="800.0" y="401.1" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#20343f">
<tspan x="800.0" dy="0">LOCAL / MESO</tspan>
<tspan x="800.0" dy="25.2">Junctions, branching, turn geometry</tspan>
<tspan x="800.0" dy="25.2">Visibility, decision points, accessibility</tspan>
</text>
<rect x="605" y="500" width="390" height="110" rx="10" stroke="#a4b5be" fill="#fff"/>
<text x="800.0" y="536.0999999999999" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#20343f">
<tspan x="800.0" dy="0">IMMEDIATE / MICRO</tspan>
<tspan x="800.0" dy="25.2">Signs, landmarks, blockage, crowd</tspan>
<tspan x="800.0" dy="25.2">Hazards, lighting, boundaries</tspan>
</text>
<text x="800" y="660" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#20343f">
<tspan x="800" dy="0">Current Environmentₜ only.</tspan>
<tspan x="800" dy="23.799999999999997">Historical exposure stays in History.</tspan>
<tspan x="800" dy="23.799999999999997">Environment demand ≠ Human difficulty.</tspan>
</text>
<rect x="1050" y="170" width="470" height="590" rx="10" stroke="#a4b5be" fill="#edf2f7"/>
<text x="1285" y="206" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="600" fill="#20343f">
<tspan x="1285" dy="0">MACHINE / IT</tspan>
</text>
<rect x="1070" y="230" width="430" height="78" rx="10" stroke="#a4b5be" fill="#fff"/>
<text x="1285.0" y="263.05" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#20343f">
<tspan x="1285.0" dy="0">SENSE</tspan>
<tspan x="1285.0" dy="23.799999999999997">Observe Human + Environment</tspan>
</text>
<path d="M1285 310L1285 328" stroke="#526774" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
<rect x="1070" y="330" width="430" height="78" rx="10" stroke="#a4b5be" fill="#fff"/>
<text x="1285.0" y="363.05" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#20343f">
<tspan x="1285.0" dy="0">ESTIMATE</tspan>
<tspan x="1285.0" dy="23.799999999999997">Uncertainty + provenance; estimate ≠ state</tspan>
</text>
<path d="M1285 410L1285 428" stroke="#526774" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
<rect x="1070" y="430" width="430" height="78" rx="10" stroke="#a4b5be" fill="#fff"/>
<text x="1285.0" y="463.05" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#20343f">
<tspan x="1285.0" dy="0">DECIDE</tspan>
<tspan x="1285.0" dy="23.799999999999997">Whether / when / modality / intensity</tspan>
</text>
<path d="M1285 510L1285 528" stroke="#526774" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
<rect x="1070" y="530" width="430" height="78" rx="10" stroke="#a4b5be" fill="#fff"/>
<text x="1285.0" y="563.0500000000001" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#20343f">
<tspan x="1285.0" dy="0">INTERVENE</tspan>
<tspan x="1285.0" dy="23.799999999999997">Deliver support; capability ≠ support</tspan>
</text>
<text x="1285" y="660" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#20343f">
<tspan x="1285" dy="0">OBSERVE RESPONSE → ADAPT / ESCALATE</tspan>
<tspan x="1285" dy="22.4">Macro / meso estimates + spatial context</tspan>
<tspan x="1285" dy="22.4">Micro inputs optional; no adaptive policy built</tspan>
</text>
<path d="M315 760L315 800" stroke="#526774" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
<path d="M800 760L800 800" stroke="#526774" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
<path d="M1285 760L1285 800" stroke="#526774" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
<path d="M315 800H1285M800 800V825" stroke="#526774" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
<rect x="205" y="830" width="1190" height="85" rx="10" stroke="#a4b5be" fill="#e6eef0"/>
<text x="800.0" y="865.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#20343f">
<tspan x="800.0" dy="0">DYNAMIC H × E × M COUPLING / NAVIGATION CHALLENGE</tspan>
<tspan x="800.0" dy="28.0">H×E · H×M · E×M · H×E×M hypotheses; unassessed construct, no validated score</tspan>
</text>
<path d="M800 915L800 940" stroke="#526774" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
<rect x="205" y="945" width="1190" height="100" rx="10" stroke="#a4b5be" fill="#f2f5f6"/>
<text x="800.0" y="975.05" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#20343f">
<tspan x="800.0" dy="0">BEHAVIOR / PERFORMANCE / SAFETY / EXPERIENCE / LEARNING</tspan>
<tspan x="800.0" dy="26.599999999999998">Immediate: accuracy, time, efficiency, safety, workload</tspan>
<tspan x="800.0" dy="26.599999999999998">Longer-term: learning, cognitive maps, retention, dependence, recovery</tspan>
</text>
<path d="M800 1045L800 1070" stroke="#526774" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
<rect x="360" y="1075" width="880" height="65" rx="10" stroke="#a4b5be" fill="#f2f5f6"/>
<text x="800.0" y="1113.8" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#20343f">
<tspan x="800.0" dy="0">FEEDBACK OVER TIME — proposed Human / Machine / position updates</tspan>
</text>
<path d="M1240 1107H1555V110H1520" stroke="#526774" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="800" y="1180" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#20343f">
<tspan x="800" dy="0">Dashed arrows: candidate dependencies / temporal feedback, not validated causal pathways.</tspan>
</text>
<text x="800" y="1214" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#20343f">
<tspan x="800" dy="0">Neural explanation is optional. No behavior-to-latent-state or neural inference is automatic.</tspan>
</text>
<text x="800" y="1248" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#20343f">
<tspan x="800" dy="0">Source scope and applicability require review; no model, coefficient or assistance–learning effect is established.</tspan>
</text>
</svg>